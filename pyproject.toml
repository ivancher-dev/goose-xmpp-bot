[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goose-xmpp-bot"
version = "0.1.0"
description = "Диагностический семейный XMPP-помощник"
requires-python = ">=3.12,<3.13"
dependencies = ["slixmpp==1.17.0", "slixmpp-omemo==2.2.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
goose-bot = "goose.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
